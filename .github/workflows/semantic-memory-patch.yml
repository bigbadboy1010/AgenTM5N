name: Apply semantic workspace memory integration

on:
  push:
    branches:
      - agent/semantic-workspace-index
    paths:
      - .github/workflows/semantic-memory-patch.yml

permissions:
  contents: write

jobs:
  apply-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-workspace-index
          fetch-depth: 0

      - name: Apply guarded source patches
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          models = "Sources/AgenTM5N/Domain/Models.swift"
          replace_once(
              models,
              '  case neuralEngine = "Neural Engine"\n  case settings = "Settings"',
              '  case neuralEngine = "Neural Engine"\n  case memory = "Workspace Memory"\n  case settings = "Settings"'
          )
          replace_once(
              models,
              '    case .neuralEngine: "brain.head.profile"\n    case .settings: "gearshape"',
              '    case .neuralEngine: "brain.head.profile"\n    case .memory: "books.vertical"\n    case .settings: "gearshape"'
          )

          root = "Sources/AgenTM5N/Views/RootView.swift"
          replace_once(
              root,
              '        case .neuralEngine:\n          NeuralEngineView()\n        case .settings:',
              '        case .neuralEngine:\n          NeuralEngineView()\n        case .memory:\n          WorkspaceMemoryView()\n        case .settings:'
          )
          replace_once(
              root,
              '    case .neuralEngine:\n      return "Neural Engine"\n    case .settings:',
              '''    case .neuralEngine:
      return "Neural Engine"
    case .memory:
      return L10n.text(
        de: "Workspace-Gedächtnis",
        en: "Workspace Memory",
        fr: "Mémoire de l’espace de travail"
      )
    case .settings:'''
          )

          app = "Sources/AgenTM5N/App/AppState.swift"
          replace_once(
              app,
              '''private struct CoreMLToolPredictionDescriptor: Encodable {
  let modelID: String
  let modelName: String
  let computePolicy: String
  let durationMilliseconds: Double
  let values: [String: String]
}

@MainActor''',
              '''private struct CoreMLToolPredictionDescriptor: Encodable {
  let modelID: String
  let modelName: String
  let computePolicy: String
  let durationMilliseconds: Double
  let values: [String: String]
}

private struct WorkspaceIndexToolStatusDescriptor: Encodable {
  let indexed: Bool
  let modelID: String?
  let modelName: String?
  let createdAt: Date?
  let fileCount: Int?
  let chunkCount: Int?
  let embeddingDimension: Int?
  let indexedCharacterCount: Int?
}

private struct WorkspaceSemanticToolMatchDescriptor: Encodable {
  let relativePath: String
  let startLine: Int
  let endLine: Int
  let score: Double
  let excerpt: String
}

@MainActor'''
          )
          replace_once(
              app,
              '''  @Published public var coreMLPredictionResult: CoreMLPredictionResult?
  @Published public var isRunningCoreML = false

  private let configurationStore:''',
              '''  @Published public var coreMLPredictionResult: CoreMLPredictionResult?
  @Published public var isRunningCoreML = false

  @Published public var workspaceIndexStatus: WorkspaceIndexStatus?
  @Published public var workspaceEmbeddingModelID: UUID?
  @Published public var workspaceSemanticQuery = ""
  @Published public var workspaceSemanticResults: [WorkspaceSemanticMatch] = []
  @Published public var isBuildingWorkspaceIndex = false

  private let configurationStore:'''
          )
          replace_once(
              app,
              '''  private let appleProvider: AppleFoundationModelsProvider
  private let coreMLService: CoreMLService
  private let sshLaunchService: SSHLaunchService''',
              '''  private let appleProvider: AppleFoundationModelsProvider
  private let coreMLService: CoreMLService
  private let workspaceIndexService: WorkspaceIndexService
  private let sshLaunchService: SSHLaunchService'''
          )
          replace_once(
              app,
              '''    appleProvider: AppleFoundationModelsProvider = AppleFoundationModelsProvider(),
    coreMLService: CoreMLService = CoreMLService(),
    sshLaunchService: SSHLaunchService = SSHLaunchService(),''',
              '''    appleProvider: AppleFoundationModelsProvider = AppleFoundationModelsProvider(),
    coreMLService: CoreMLService = CoreMLService(),
    workspaceIndexService: WorkspaceIndexService = WorkspaceIndexService(),
    sshLaunchService: SSHLaunchService = SSHLaunchService(),'''
          )
          replace_once(
              app,
              '''    self.appleProvider = appleProvider
    self.coreMLService = coreMLService
    self.sshLaunchService = sshLaunchService''',
              '''    self.appleProvider = appleProvider
    self.coreMLService = coreMLService
