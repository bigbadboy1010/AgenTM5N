          )
          replace_once(
              app,
              '''      coreMLModels = snapshot.models
      activeCoreMLModelID = snapshot.activeModelID
      coreMLDescriptor = snapshot.activeDescriptor

      let appleStatus''',
              '''      coreMLModels = snapshot.models
