name: AgenTM5N source policy

on:
  push:
    branches:
      - main
      - agent/v1.1.0-platform-expansion
      - agent/v1.2.0-agent-operating-layer
      - agent/v1.3.0-neural-control-plane
  pull_request:
    branches:
      - main
      - agent/v1.1.0-platform-expansion
      - agent/v1.2.0-agent-operating-layer
      - agent/v1.3.0-neural-control-plane

permissions:
  contents: read

jobs:
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n scripts/build-app.sh
          bash -n scripts/verify.sh
          bash -n scripts/check-release.sh
          bash -n scripts/release-macos.sh
          bash -n scripts/verify-release-dmg.sh
          bash -n scripts/publish-github-release.sh
          bash -n scripts/bootstrap-anemll-runtime.sh
          bash -n scripts/test-anemll-qwen3.sh

      - name: Validate Build 36 metadata consistency
        shell: python
        run: |
          from pathlib import Path

          expected = {
              "scripts/build-app.sh": [
                  'VERSION="${AGENTM5N_VERSION:-1.3.6}"',
                  'BUILD_NUMBER="${AGENTM5N_BUILD_NUMBER:-36}"',
                  "Build 36 adds the native Swift ANEMLL bridge",
              ],
              "scripts/release-macos.sh": [
                  'VERSION="${AGENTM5N_VERSION:-1.3.6}"',
                  'BUILD_NUMBER="${AGENTM5N_BUILD_NUMBER:-36}"',
              ],
              "scripts/check-release.sh": [
                  'EXPECTED_VERSION="${AGENTM5N_VERSION:-1.3.6}"',
                  'EXPECTED_BUILD="${AGENTM5N_BUILD_NUMBER:-36}"',
              ],
              "scripts/verify-release-dmg.sh": [
                  'VERSION="${AGENTM5N_VERSION:-1.3.6}"',
                  'BUILD_NUMBER="${AGENTM5N_BUILD_NUMBER:-36}"',
              ],
              "scripts/publish-github-release.sh": [
                  'VERSION="${AGENTM5N_VERSION:-1.3.6}"',
                  'BUILD_NUMBER="${AGENTM5N_BUILD_NUMBER:-36}"',
                  'TAG="${AGENTM5N_GITHUB_TAG:-v${VERSION}-build${BUILD_NUMBER}}"',
              ],
              "scripts/bootstrap-anemll-runtime.sh": [
                  "fb42f60b2e7a7b4709052c7146d37480bf21941e",
                  "swift build -c release --product anemllcli",
                  "codesign --force --sign - --options runtime",
              ],
          }

          failures = []
          for filename, needles in expected.items():
              text = Path(filename).read_text()
              for needle in needles:
                  if needle not in text:
                      failures.append(f"{filename}: missing {needle!r}")

          if failures:
              raise SystemExit("\n".join(failures))

      - name: Validate security and neural runtime invariants
        shell: python
        run: |
          from pathlib import Path

          checks = {
              "Sources/AgenTM5N/Services/AgentToolRegistry.swift": [
                  "requiresWorkspaceTrustedApproval",
                  "BundledToolCatalog.entry",
                  "case .macPersonal, .reminders, .system, .agents, .workflows",
              ],
              "Sources/AgenTM5N/Services/BundledToolCatalog.swift": [
                  "custom_builtin_docker_action",
                  "custom_builtin_kube_apply",
                  "custom_builtin_mcp_stdio_call",
              ],
              "Sources/AgenTM5N/Services/ToolStagnationGuard.swift": [
                  "STAGNATION_GUARD_TRIGGERED",
                  "maxIdenticalToolRounds",
              ],
              "Sources/AgenTM5N/Services/SecureSecretBroker.swift": [
                  "validateSecretHostBinding",
                  "secretHostMismatch",
              ],
              "Sources/AgenTM5N/Services/AgentToolExecutionBridge.swift": [
                  "acquireExecutionPermit",
                  "capabilities.intersection(requested)",
              ],
              "Sources/AgenTM5N/Services/CoreMLManagedStorage.swift": [
                  "SHA256",
                  "model-\\(contentHash)",
              ],
              "Sources/AgenTM5N/Services/CoreMLPredictionRunner.swift": [
                  "CoreMLAdaptiveExecutionPolicy.resolve",
                  "route.allowsAutomaticFailover",
                  "sessionModes",
                  "configuration.computeUnits = mode.computeUnits",
                  "CoreMLAdaptiveExecutionTelemetry.shared.record",
                  "MLState",
              ],
              "Sources/AgenTM5N/Services/CoreMLAdaptiveExecutionPolicy.swift": [
                  "CoreMLExecutionStrategy",
                  "expectedPredictions: Int?",
                  "decision.confidence != .low",
                  "automaticFailover",
              ],
              "Sources/AgenTM5N/Services/CoreMLAdaptiveExecutionTelemetry.swift": [
                  "CoreMLExecutionTelemetrySnapshot",
                  "NSLock",
                  "adaptiveRoutingApplied",
              ],
              "Sources/AgenTM5N/Services/CoreMLNeuralRuntimeOrchestrator.swift": [
                  "CoreMLNeuralWorkloadKind",
                  "workspaceEmbeddingQuery",
                  "workspaceEmbeddingBatch",
                  "CoreMLAdaptiveExecutionPolicy.resolve",
              ],
              "Sources/AgenTM5N/Services/CoreMLNeuralRuntimeTelemetry.swift": [
                  "CoreMLNeuralRuntimeEvent",
                  "maximumEvents",
                  "fallbackUsed",
              ],
              "Sources/AgenTM5N/Services/CoreMLEmbeddingRunner.swift": [
                  "CoreMLNeuralRuntimeOrchestrator.resolve",
                  "route.allowsAutomaticFailover",
                  "configuration.computeUnits = mode.computeUnits",
                  "CoreMLNeuralRuntimeTelemetry.shared.record",
              ],
              "Sources/AgenTM5N/Services/ANEMLLRuntime.swift": [
                  "ANEMLLModelBundleInspector",
                  'contains("embeddings")',
                  "ffn",
                  "lm_head",
                  "AGENTM5N_ANEMLLCLI",
                  "AGENTM5N_ANEMLL_META",
                  "--save",
                  "withTaskCancellationHandler",
                  "parseMetrics",
              ],
              "Sources/AgenTM5N/Providers/ANEMLLProvider.swift": [
                  "ANEMLLNativeRuntime.complete",
                  "ANEMLLRuntimeTelemetry.shared.record",
                  "latestUserPrompt",
              ],
              "Sources/AgenTM5N/Views/ANEMLLQwenLabView.swift": [
                  "Qwen3 ANE Runtime Lab · Build 36",
                  "Qwen3 nativ testen",
                  "ANEMLLNativeRuntime.complete",
              ],
              "Sources/AgenTM5N/App/AgenTM5NApp.swift": [
                  "anemll-qwen3-runtime",
                  "ANEMLLRuntimeCommands",
              ],
              "Sources/AgenTM5N/Services/CoreMLAgentTools.swift": [
                  "AgenTM5N Neural Runtime",
                  "Adaptive mode",
              ],
              "Sources/AgenTM5N/Services/CoreMLModelLab.swift": [
                  "benchmarkModes",
                  "neuralEnginePreferred",
                  "aneSuitabilityScore",
              ],
              "Sources/AgenTM5N/Services/CoreMLRuntimeBenchmark.swift": [
                  "MLModel.prediction",
                  "warmP50Milliseconds",
                  "warmP95Milliseconds",
                  "configuration.computeUnits = mode.computeUnits",
              ],
              "Sources/AgenTM5N/Services/CoreMLAdaptiveRouter.swift": [
                  "aneBreakEvenPredictionsVersusAutomatic",
                  "estimatedTotalMilliseconds",
                  "outputsStructurallyEquivalent",
                  "coreMLRoutingProfilesFile",
                  "neuralEnginePreferred",
              ],
              "Sources/AgenTM5N/Views/CoreMLRuntimeBenchmarkView.swift": [
                  "ANE Runtime Benchmark · Build 33",
                  "Runtime Benchmark starten",
                  "not actual NPU utilization",
              ],
              "Sources/AgenTM5N/Views/CoreMLAdaptiveRouterView.swift": [
                  "Adaptive Neural Execution · Build 34",
                  "Ausführungsstrategie",
                  "Adaptive Execution ist aktiv",
                  "ANE Break-even vs. Automatisch",
              ],
              "Sources/AgenTM5N/Providers/MLXProvider.swift": [
                  "/v1/chat/completions",
                  "ProviderToolCall",
              ],
              "Tests/AgenTM5NTests/SecurityPolicyTests.swift": [
                  "testSecretHostBindingRejectsDifferentHTTPSHost",
                  "testPersistentAgentResolveIntersectsRestrictedParentScope",
                  "testCoreMLManagedStorageDeduplicatesIdenticalContentAcrossDifferentNames",
              ],
              "Tests/AgenTM5NTests/OperatingLayerTests.swift": [
                  "testFixedToolBudgetSupportsValuesAboveLegacyLimit",
                  "testUnlimitedToolBudgetHasNoFiniteOperatingLimit",
                  "testStagnationGuardBlocksOnlyAfterConfiguredThreshold",
              ],
              "Tests/AgenTM5NTests/CoreMLRuntimeBenchmarkTests.swift": [
                  "testFastestWarmP50IsSelected",
                  "testFailedModeDoesNotPreventSuccessfulComparison",
                  "testDifferentOutputStructuresAreFlagged",
              ],
              "Tests/AgenTM5NTests/CoreMLAdaptiveRouterTests.swift": [
                  "testM5DistilBERTInteractiveWorkloadPrefersAutomatic",
                  "testM5DistilBERTSustainedWorkloadPrefersANE",
                  "testDifferentOutputStructuresKeepAutomaticAsSafeChoice",
              ],
              "Tests/AgenTM5NTests/CoreMLAdaptiveExecutionPolicyTests.swift": [
                  "testManualStrategyPreservesSelectedComputeMode",
                  "testAdaptiveStrategyWithoutProfileFallsBackToAutomatic",
                  "testLowConfidenceAdaptiveDecisionFallsBackToAutomatic",
                  "testHighConfidenceAdaptiveDecisionSelectsRecommendedMode",
                  "testAdaptiveAutomaticRecommendationDoesNotNeedFailover",
              ],
              "Tests/AgenTM5NTests/CoreMLNeuralRuntimeOrchestratorTests.swift": [
                  "testWorkspaceSearchEmbeddingIsOneShot",
                  "testWorkspaceIndexEmbeddingUsesActualBatchSize",
                  "testManualWorkloadSizedRoutePreservesSelectedMode",
                  "testAdaptiveWorkloadSizedRouteUsesDecisionPredictionCount",
              ],
              "Tests/AgenTM5NTests/ANEMLLRuntimeTests.swift": [
                  "testQwenBundleInspectorFindsSplitComponentsAndPrefersLUTHead",
                  "testSwiftCLIMetricsParserReadsDecodePrefillTTFTAndTokens",
                  "testQwenBundleInspectorRejectsMissingTokenizer",
              ],
              "scripts/test-anemll-qwen3.sh": [
                  "NATIVE QWEN3 GATE: OK",
                  "--save",
                  "TTFT",
              ],
          }

          failures = []
          for filename, needles in checks.items():
              text = Path(filename).read_text()
              for needle in needles:
                  if needle not in text:
                      failures.append(f"{filename}: security/neural invariant missing {needle!r}")

          if failures:
              raise SystemExit("\n".join(failures))

      - name: Note target-Mac gate
        run: |
          echo "Static source policy passed."
          echo "Full Swift/Xcode/FoundationModels/CoreML/ANEMLL verification remains mandatory on the target Apple Silicon Mac via scripts/verify.sh plus the native Qwen3 smoke gate."
