name: AgenTM5N source policy

on:
  push:
    branches:
      - main
      - agent/v1.1.0-platform-expansion
      - agent/v1.2.0-agent-operating-layer
      - agent/v1.3.0-neural-control-plane
  pull_request:
    branches:
      - main
      - agent/v1.1.0-platform-expansion
      - agent/v1.2.0-agent-operating-layer

permissions:
  contents: read

jobs:
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n scripts/build-app.sh
          bash -n scripts/verify.sh
          bash -n scripts/check-release.sh
          bash -n scripts/release-macos.sh
          bash -n scripts/verify-release-dmg.sh
          bash -n scripts/publish-github-release.sh

      - name: Validate Build 32 metadata consistency
        shell: python
        run: |
          from pathlib import Path

          expected = {
              "scripts/build-app.sh": [
                  'VERSION="${AGENTM5N_VERSION:-1.3.2}"',
                  'BUILD_NUMBER="${AGENTM5N_BUILD_NUMBER:-32}"',
                  "Build 32 adds real Core ML runtime latency benchmarking",
              ],
              "scripts/release-macos.sh": [
                  'VERSION="${AGENTM5N_VERSION:-1.3.2}"',
                  'BUILD_NUMBER="${AGENTM5N_BUILD_NUMBER:-32}"',
              ],
              "scripts/check-release.sh": [
                  'EXPECTED_VERSION="${AGENTM5N_VERSION:-1.3.2}"',
                  'EXPECTED_BUILD="${AGENTM5N_BUILD_NUMBER:-32}"',
              ],
              "scripts/verify-release-dmg.sh": [
                  'VERSION="${AGENTM5N_VERSION:-1.3.2}"',
                  'BUILD_NUMBER="${AGENTM5N_BUILD_NUMBER:-32}"',
              ],
              "scripts/publish-github-release.sh": [
                  'VERSION="${AGENTM5N_VERSION:-1.3.2}"',
                  'BUILD_NUMBER="${AGENTM5N_BUILD_NUMBER:-32}"',
                  'TAG="${AGENTM5N_GITHUB_TAG:-v${VERSION}-build${BUILD_NUMBER}}"',
              ],
          }

          failures = []
          for filename, needles in expected.items():
              text = Path(filename).read_text()
              for needle in needles:
                  if needle not in text:
                      failures.append(f"{filename}: missing {needle!r}")

          if failures:
              raise SystemExit("\n".join(failures))

      - name: Validate security and neural runtime invariants
        shell: python
        run: |
          from pathlib import Path

          checks = {
              "Sources/AgenTM5N/Services/AgentToolRegistry.swift": [
                  "requiresWorkspaceTrustedApproval",
                  "BundledToolCatalog.entry",
                  "case .macPersonal, .reminders, .system, .agents, .workflows",
              ],
              "Sources/AgenTM5N/Services/BundledToolCatalog.swift": [
                  "custom_builtin_docker_action",
                  "custom_builtin_kube_apply",
                  "custom_builtin_mcp_stdio_call",
              ],
              "Sources/AgenTM5N/Services/ToolStagnationGuard.swift": [
                  "STAGNATION_GUARD_TRIGGERED",
                  "maxIdenticalToolRounds",
              ],
              "Sources/AgenTM5N/Services/SecureSecretBroker.swift": [
                  "validateSecretHostBinding",
                  "secretHostMismatch",
              ],
              "Sources/AgenTM5N/Services/AgentToolExecutionBridge.swift": [
                  "acquireExecutionPermit",
                  "capabilities.intersection(requested)",
              ],
              "Sources/AgenTM5N/Services/CoreMLManagedStorage.swift": [
                  "SHA256",
                  "model-\\(contentHash)",
              ],
              "Sources/AgenTM5N/Services/CoreMLPredictionRunner.swift": [
                  "loadedModels",
                  "CoreMLRuntimePolicyStore.currentMode",
                  "configuration.computeUnits = mode.computeUnits",
                  "MLState",
              ],
              "Sources/AgenTM5N/Services/CoreMLModelLab.swift": [
                  "benchmarkModes",
                  "neuralEnginePreferred",
                  "aneSuitabilityScore",
              ],
              "Sources/AgenTM5N/Services/CoreMLRuntimeBenchmark.swift": [
                  "MLModel.prediction",
                  "warmP50Milliseconds",
                  "warmP95Milliseconds",
                  "configuration.computeUnits = mode.computeUnits",
              ],
              "Sources/AgenTM5N/Views/CoreMLRuntimeBenchmarkView.swift": [
                  "ANE Runtime Benchmark · Build 32",
                  "Runtime Benchmark starten",
                  "not actual NPU utilization",
              ],
              "Sources/AgenTM5N/Providers/MLXProvider.swift": [
                  "/v1/chat/completions",
                  "ProviderToolCall",
              ],
              "Tests/AgenTM5NTests/SecurityPolicyTests.swift": [
                  "testSecretHostBindingRejectsDifferentHTTPSHost",
                  "testPersistentAgentResolveIntersectsRestrictedParentScope",
                  "testCoreMLManagedStorageDeduplicatesIdenticalContentAcrossDifferentNames",
              ],
              "Tests/AgenTM5NTests/OperatingLayerTests.swift": [
                  "testFixedToolBudgetSupportsValuesAboveLegacyLimit",
                  "testUnlimitedToolBudgetHasNoFiniteOperatingLimit",
                  "testStagnationGuardBlocksOnlyAfterConfiguredThreshold",
              ],
              "Tests/AgenTM5NTests/CoreMLRuntimeBenchmarkTests.swift": [
                  "testFastestWarmP50IsSelected",
                  "testFailedModeDoesNotPreventSuccessfulComparison",
                  "testDifferentOutputStructuresAreFlagged",
              ],
          }

          failures = []
          for filename, needles in checks.items():
              text = Path(filename).read_text()
              for needle in needles:
                  if needle not in text:
                      failures.append(f"{filename}: security/neural invariant missing {needle!r}")

          if failures:
              raise SystemExit("\n".join(failures))

      - name: Note target-Mac gate
        run: |
          echo "Static source policy passed."
          echo "Full Swift/Xcode/FoundationModels/CoreML/MLX verification remains mandatory on the target Apple Silicon Mac via scripts/verify.sh and VALIDATION.md."
