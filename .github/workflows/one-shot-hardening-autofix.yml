name: AgenTM5N one-shot hardening autofix

on:
  push:
    branches:
      - agent/v1.1.0-platform-expansion

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[autofix-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.1.0-platform-expansion
          fetch-depth: 0

      - name: Apply exact reviewed replacements
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "Sources/AgenTM5N/Services/SelfBuiltToolAgentTools.swift",
              """      storage[index].source = source
          storage[index].isEnabled = true
          storage[index].updatedAt = Date()
""",
              """      storage[index].source = source
          // Preserve an explicit disabled state when only the implementation is replaced.
          storage[index].updatedAt = Date()
""",
          )

          replace_once(
              "Sources/AgenTM5N/App/AppStatePlatformExpansion.swift",
              """      let nextDepth = AgentDelegationContext.depth + 1
          let delegatedScope = profile.allowedCapabilities.map(Set.init)
""",
              """      let nextDepth = AgentDelegationContext.depth + 1
          let delegatedScope = AgentCapabilityExecutionContext.delegatedScope(
            parent: AgentCapabilityExecutionContext.allowedCapabilities,
            profile: profile.allowedCapabilities.map(Set.init)
          )
""",
          )

          replace_once(
              "Sources/AgenTM5N/App/AppStatePlatformExpansion.swift",
              '      ) as? String ?? "1.1.1",\n      build: Bundle.main.object(forInfoDictionaryKey: "CFBundleVersion") as? String\n        ?? "25",',
              '      ) as? String ?? "1.1.2",\n      build: Bundle.main.object(forInfoDictionaryKey: "CFBundleVersion") as? String\n        ?? "28",',
          )

          replace_once(
              "Sources/AgenTM5N/App/AppState.swift",
              """  private let agentRuntime: AgentRuntime
          private var generationTask: Task<Void, Never>?
          private var approvalContinuation: CheckedContinuation<Bool, Never>?
""",
              """  private let agentRuntime: AgentRuntime
          private var generationTask: Task<Void, Never>?

          private struct ToolApprovalWaiter {
            let approval: PendingToolApproval
            let continuation: CheckedContinuation<Bool, Never>
          }

          private var activeApprovalWaiter: ToolApprovalWaiter?
          private var queuedApprovalWaiters: [ToolApprovalWaiter] = []
""",
          )

          replace_once(
              "Sources/AgenTM5N/App/AppState.swift",
              """  public func stopGeneration() {
          resolvePendingApproval(allowed: false)
          generationTask?.cancel()
""",
              """  public func stopGeneration() {
          cancelAllPendingApprovals()
          generationTask?.cancel()
""",
          )

          replace_once(
              "Sources/AgenTM5N/App/AppState.swift",
              """  private func requestToolApproval(
          call: ProviderToolCall,
          risk: ToolRisk,
          summary: String
        ) async -> Bool {
          await withCheckedContinuation { continuation in
            approvalContinuation = continuation
            pendingToolApproval = PendingToolApproval(
              call: call,
              risk: risk,
              summary: summary
            )
          }
        }

        private func resolvePendingApproval(allowed: Bool) {
          pendingToolApproval = nil
          guard let continuation = approvalContinuation else { return }
          approvalContinuation = nil
          continuation.resume(returning: allowed)
        }
""",
              """  private func requestToolApproval(
          call: ProviderToolCall,
          risk: ToolRisk,
          summary: String
        ) async -> Bool {
          await withCheckedContinuation { continuation in
            let waiter = ToolApprovalWaiter(
              approval: PendingToolApproval(
                call: call,
                risk: risk,
                summary: summary
              ),
              continuation: continuation
            )
            if activeApprovalWaiter == nil {
              activeApprovalWaiter = waiter
              pendingToolApproval = waiter.approval
            } else {
              queuedApprovalWaiters.append(waiter)
            }
          }
        }

        private func resolvePendingApproval(allowed: Bool) {
          guard let waiter = activeApprovalWaiter else {
            pendingToolApproval = nil
            return
          }
          activeApprovalWaiter = nil
          pendingToolApproval = nil
          waiter.continuation.resume(returning: allowed)
          presentNextPendingApprovalIfNeeded()
        }

        private func presentNextPendingApprovalIfNeeded() {
          guard activeApprovalWaiter == nil, !queuedApprovalWaiters.isEmpty else { return }
          let next = queuedApprovalWaiters.removeFirst()
          activeApprovalWaiter = next
          pendingToolApproval = next.approval
        }

        private func cancelAllPendingApprovals() {
          pendingToolApproval = nil
          if let active = activeApprovalWaiter {
            activeApprovalWaiter = nil
            active.continuation.resume(returning: false)
          }
          let queued = queuedApprovalWaiters
          queuedApprovalWaiters.removeAll(keepingCapacity: false)
          for waiter in queued {
            waiter.continuation.resume(returning: false)
          }
        }
""",
          )

          replace_once(
              "Sources/AgenTM5N/App/AppState.swift",
              """    resolvePendingApproval(allowed: false)
          isGenerating = false
          generationTask = nil
""",
              """    cancelAllPendingApprovals()
          isGenerating = false
          generationTask = nil
""",
          )

          replace_once(
              "Sources/AgenTM5N/Views/AgentsView.swift",
              """        } else {
          Label(
            "Volle Tool-Parität mit dem Haupt-Agenten",
            systemImage: "checkmark.shield.fill"
          )
          .fontWeight(.semibold)
          Text("Dieser Agent erbt standardmäßig alle zentral autorisierten AgenTM5N-Werkzeuge des Haupt-Agenten. Eine Capability-Liste wird nur verwendet, wenn ausdrücklich eine eingeschränkte Sandbox gewünscht ist.")
            .font(.caption)
            .foregroundStyle(.secondary)
        }
""",
              """        } else if profile.allowedCapabilities != nil {
          Label(
            "Keine Tool-Capabilities freigegeben",
            systemImage: "lock.shield.fill"
          )
          .fontWeight(.semibold)
          Text("Dieser Agent besitzt eine explizite leere Sandbox und kann keine AgenTM5N-Werkzeuge aufrufen.")
            .font(.caption)
            .foregroundStyle(.secondary)
        } else {
          Label(
            "Volle Tool-Parität mit dem Haupt-Agenten",
            systemImage: "checkmark.shield.fill"
          )
          .fontWeight(.semibold)
          Text("Dieser Agent erbt standardmäßig alle zentral autorisierten AgenTM5N-Werkzeuge des Haupt-Agenten. Eine Capability-Liste wird nur verwendet, wenn ausdrücklich eine eingeschränkte Sandbox gewünscht ist.")
            .font(.caption)
            .foregroundStyle(.secondary)
        }
""",
          )

          replace_once(
              "Sources/AgenTM5N/Views/NeuralEngineView.swift",
              """                de: "Geladen",
                en: "Loaded",
                fr: "Chargé"
""",
              """                de: "Registriert",
                en: "Registered",
                fr: "Enregistré"
""",
          )

          replace_once(
              "Sources/AgenTM5N/Services/CoreMLAgentTools.swift",
              "Run a local Core ML prediction with the requested CPU + Apple Neural Engine compute policy.",
              "Run a local Core ML prediction with all available CPU, GPU and Apple Neural Engine compute units; Core ML decides operator placement.",
          )

          replace_once(
              "Sources/AgenTM5N/Providers/AppleRoutedKnowledgeMemoryTools.swift",
              "When an embedding model is configured, AgenTM5N runs the query embedding locally through Core ML with CPU + Apple Neural Engine policy.",
              "When an embedding model is configured, AgenTM5N runs the query embedding locally through Core ML with all available CPU, GPU and Apple Neural Engine compute units; Core ML decides operator placement.",
          )

          # Remove this one-shot workflow in the same commit so it cannot loop.
          Path(".github/workflows/one-shot-hardening-autofix.yml").unlink()

      - name: Commit autofix
        run: |
          git config user.name "AgenTM5N Hardening Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Complete reviewed runtime hardening [autofix-complete]"
          git push origin HEAD:agent/v1.1.0-platform-expansion
