name: Source validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n scripts/bootstrap-xcode.sh
          bash -n scripts/build-app.sh
          bash -n scripts/check-release.sh
          bash -n scripts/check-portable-anemll.sh
          bash -n scripts/publish-github-release.sh
          bash -n scripts/release-macos.sh
          bash -n scripts/release-portable-macos.sh
          bash -n scripts/run-dev.sh
          bash -n scripts/verify-release-dmg.sh
          bash -n scripts/verify.sh
          bash -n scripts/bootstrap-anemll-runtime.sh
          bash -n scripts/test-anemll-qwen3.sh
          bash -n scripts/diagnose-resource-pressure.sh
          bash -n scripts/capture-resource-trace.sh
          bash -n scripts/run-m5-safety-gate.sh
          bash -n scripts/lib/xcode-env.sh
          bash -n scripts/lib/release-metadata.sh
      - name: Validate release metadata source of truth
        run: |
          source scripts/lib/release-metadata.sh
          agentm5n_validate_release_metadata
          test "$(agentm5n_release_version)" = "1.4.2"
          test "$(agentm5n_release_build_number)" = "42"
          ! grep -nE '1\.4\.1|BUILD_NUMBER="\$\{AGENTM5N_BUILD_NUMBER:-41\}"|EXPECTED_BUILD="\$\{AGENTM5N_BUILD_NUMBER:-41\}"' \
            scripts/build-app.sh \
            scripts/check-release.sh \
            scripts/publish-github-release.sh \
            scripts/release-macos.sh \
            scripts/release-portable-macos.sh \
            scripts/verify-release-dmg.sh
      - name: Parse Swift sources
        run: |
          if command -v swiftc >/dev/null 2>&1; then
            find Sources -type f -name '*.swift' -print0 \
              | xargs -0 swiftc -frontend -parse
          else
            echo 'swiftc is not installed on this runner; parse check skipped.'
          fi
      - name: Reject incomplete source markers
        run: |
          ! grep -RInE 'TODO|FIXME|fatalError\(|try!| as! ' Sources
