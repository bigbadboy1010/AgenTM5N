name: Source validation

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  integrate-prompt-attachments-2-hardening:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/prompt-attachments-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prompt-attachments-2
          fetch-depth: 0
      - name: Apply guarded Prompt Attachments 2 hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-prompt-attachments-2-hardening.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/source-validation.yml
          rm -f scripts/apply-prompt-attachments-2-hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "harden Prompt Attachments 2"
          git push origin HEAD:agent/prompt-attachments-2

  shell-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n scripts/bootstrap-xcode.sh
          bash -n scripts/build-app.sh
          bash -n scripts/run-dev.sh
          bash -n scripts/verify.sh
          bash -n scripts/lib/xcode-env.sh
      - name: Parse Swift sources
        run: |
          if command -v swiftc >/dev/null 2>&1; then
            find Sources -type f -name '*.swift' -print0 \
              | xargs -0 swiftc -frontend -parse
          else
            echo 'swiftc is not installed on this runner; parse check skipped.'
          fi
      - name: Reject incomplete source markers
        run: |
          ! grep -RInE 'TODO|FIXME|fatalError\(|try!| as! ' Sources
