name: Hybrid routing policy

on:
  push:
    branches:
      - agent/v1.3.0-neural-control-plane
  pull_request:
    branches:
      - agent/v1.2.0-agent-operating-layer
      - agent/v1.3.0-neural-control-plane

permissions:
  contents: read

jobs:
  hybrid-routing-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Build 42 Phase 2 Swift sources
        run: |
          swiftc -frontend -parse \
            Sources/AgenTM5N/Domain/AgentOperatingLayerSettings.swift \
            Sources/AgenTM5N/Domain/HybridRoutingModels.swift \
            Sources/AgenTM5N/Domain/ModelProfiles.swift \
            Sources/AgenTM5N/Services/HybridInferenceRouter.swift \
            Sources/AgenTM5N/Services/HybridRoutingController.swift \
            Sources/AgenTM5N/Services/ModelProfileStore.swift \
            Sources/AgenTM5N/Services/ModelManagerController.swift \
            Sources/AgenTM5N/App/AppStateHybridRouting.swift \
            Sources/AgenTM5N/App/AgenTM5NApp.swift \
            Sources/AgenTM5N/Views/HybridRouterView.swift \
            Sources/AgenTM5N/Views/ChatView.swift \
            Tests/AgenTM5NTests/HybridRoutingTests.swift

      - name: Validate fail-safe profile-aware routing boundary
        shell: python
        run: |
          import re
          from pathlib import Path

          operating = Path("Sources/AgenTM5N/Domain/AgentOperatingLayerSettings.swift").read_text()
          models = Path("Sources/AgenTM5N/Domain/HybridRoutingModels.swift").read_text()
          profiles = Path("Sources/AgenTM5N/Domain/ModelProfiles.swift").read_text()
          router = Path("Sources/AgenTM5N/Services/HybridInferenceRouter.swift").read_text()
          controller = Path("Sources/AgenTM5N/Services/HybridRoutingController.swift").read_text()
          execution = Path("Sources/AgenTM5N/App/AppStateHybridRouting.swift").read_text()
          app = Path("Sources/AgenTM5N/App/AgenTM5NApp.swift").read_text()
          chat = Path("Sources/AgenTM5N/Views/ChatView.swift").read_text()
          tests = Path("Tests/AgenTM5NTests/HybridRoutingTests.swift").read_text()

          required = {
              "operating": [
                  "AgentOperatingLayerExecutionContext",
                  "@TaskLocal public static var configurationOverride",
                  "AgentOperatingLayerExecutionContext.configurationOverride",
              ],
              "models": [
                  "case manual",
                  "case adaptive",
                  "case activeProvider",
                  "case modelProfile",
                  "case appleOnDevice",
                  "case meshPeer",
                  "case blocked",
                  "profileID: UUID?",
                  "profileRuntime: ModelProfileRuntime?",
                  "mode: HybridRoutingMode = .manual",
                  "allowMesh: Bool = false",
                  "privacyLockEnabled: Bool = true",
              ],
              "profiles": [
                  "ModelProfileCatalog",
                  "routingCandidates",
                  "apiKeySecretID",
                  "if runtime.isLocal { apiKeySecretID = nil }",
              ],
              "router": [
                  "routingConfiguration.mode == .adaptive",
                  "routingConfiguration.privacyLockEnabled, personal",
                  "modelProfiles: [ModelProfile] = []",
                  "ModelProfileCatalog.routingCandidates",
                  "profile.runtime == .ollamaCloud, profile.apiKeySecretID == nil",
                  "hasImageInput, !profile.capabilities.contains(.imageInput)",
                  "needsToolCalling, !profile.capabilities.contains(.toolCalling)",
                  "routingConfiguration.allowMesh",
                  "requireExplicitMeshIntent",
                  "remoteCapabilitiesSupported",
                  ".secrets",
                  ".http",
                  ".ssh",
                  ".edge",
                  ".agents",
                  ".workflows",
              ],
              "controller": [
                  "ModelProfileStore",
                  "profiles = document.profiles",
                  "modelProfiles: profiles",
                  "HybridRoutingStore.loadConfiguration",
                  "HybridRoutingStore.saveConfiguration",
                  "HybridRoutingStore.saveDecision",
              ],
              "execution": [
                  "sendMessageHybridAware",
                  "case .activeProvider:",
                  "sendMessage()",
                  "case .modelProfile:",
                  "sendViaTemporaryModelProfile",
                  "AgentOperatingLayerExecutionContext.$configurationOverride.withValue",
                  "case .appleOnDevice:",
                  "sendViaTemporaryAppleRoute",
                  "case .meshPeer:",
                  "AgentMeshPeerStore.shared.trustedPeer",
                  "AgentMeshClient()",
                  "client.submit",
                  "client.follow",
                  "client.snapshot",
                  "client.cancel",
                  "case .blocked:",
                  "PromptAttachmentService.imageReferences",
                  "PromptAttachmentService.textAttachmentNames",
                  "JSONDocumentStore<[ChatMessage]>",
              ],
              "app": [
                  "await HybridRoutingController.shared.bootstrap()",
                  "await ModelManagerController.shared.bootstrap()",
                  'Window("Hybrid Router", id: "hybrid-router")',
                  'Window("Model Manager", id: "model-manager")',
              ],
              "chat": [
                  "appState.sendMessageHybridAware()",
              ],
              "tests": [
                  "testManualModeAlwaysKeepsActiveProvider",
                  "testAdaptiveSelectsHighestPriorityCompatibleLocalProfile",
                  "testEquivalentActiveProfileDoesNotCreateTemporaryRoute",
                  "testExplicitCloudIntentSelectsUsableCloudProfile",
                  "testCloudProfileWithoutVaultReferenceIsNeverAutomaticCandidate",
                  "testImageInputRequiresProfileImageCapability",
                  "testTaskLocalOperatingOverrideChangesRuntimeWithoutPersistingThroughProfileSchema",
                  "testPrivacyLockPrefersCompatibleLocalProfileOverHigherPriorityCloudProfile",
                  "testExplicitMeshIntentSelectsTrustedCapablePeer",
                  "testUnsupportedRemoteCapabilityFailsBackToActiveProvider",
                  "testSavedDecisionMetadataDoesNotContainPromptContents",
              ],
          }

          texts = {
              "operating": operating,
              "models": models,
              "profiles": profiles,
              "router": router,
              "controller": controller,
              "execution": execution,
              "app": app,
              "chat": chat,
              "tests": tests,
          }
          failures = []
          for key, needles in required.items():
              for needle in needles:
                  if needle not in texts[key]:
                      failures.append(f"{key}: Build 42 Phase 2 invariant missing {needle!r}")

          if "public let prompt" in models or "var prompt:" in models:
              failures.append("HybridRouteDecision must not persist prompt contents")

          privacy_index = router.find("routingConfiguration.privacyLockEnabled, personal")
          mesh_index = router.find("routingConfiguration.allowMesh", privacy_index + 1)
          if privacy_index < 0 or mesh_index < 0 or privacy_index > mesh_index:
              failures.append("Privacy Lock must be evaluated before Mesh routing")

          assignment_patterns = [
              r"\bactiveConfiguration\.providerKind\s*=(?!=)",
              r"\bactiveConfiguration\.baseURL\s*=(?!=)",
              r"\bactiveConfiguration\.apiKeySecretID\s*=(?!=)",
          ]
          for pattern in assignment_patterns:
              if re.search(pattern, router):
                  failures.append(f"Hybrid router decision plane must not mutate active provider configuration: {pattern}")

          for needle in ["SecureSecretBroker", "VaultStore"]:
              if needle in router or needle in execution:
                  failures.append(f"Hybrid routing must not access secrets directly: {needle}")

          forbidden_execution = [
              "executeAuthorizedToolCall",
              "AgentRuntime()",
              "ssh_run",
              "http_request",
              "edge_control",
              "secret_list",
              "AgentOperatingLayerStore.save",
              "ModelManagerController.shared.activate",
              "modelProfileStore.setActive",
          ]
          for needle in forbidden_execution:
              if needle in execution:
                  failures.append(
                      f"Hybrid chat execution may not create/persist a parallel model/tool/security path: {needle}"
                  )

          if "appState.sendMessage()" in chat:
              failures.append(
                  "ChatView must enter through sendMessageHybridAware so Adaptive routing cannot be bypassed"
              )

          if failures:
              raise SystemExit("\n".join(failures))

      - name: Build 42 Phase 2 boundary note
        run: |
          echo "Static Build 42 profile-aware Hybrid Router policy passed."
          echo "Per-turn model profile switching remains ephemeral; persistent settings, Vault and central tool authorization are not bypassed."
          echo "Target M5 runtime validation remains mandatory before promoting this phase."
